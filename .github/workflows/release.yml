name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build the DMG
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-dmg.sh
        env:
          UNIVERSAL: "1"

      - name: Publish the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/BobWob-$version.dmg" \
            "dist/BobWob-$version.dmg.sha256" \
            --title "BobWob $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
